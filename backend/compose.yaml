services:
  postgres-local:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_LOCAL_DB:-qleanfeel_local}
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:-qleanfeel_local}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:?Set POSTGRES_LOCAL_PASSWORD in backend/.env}
    ports:
      - '${POSTGRES_LOCAL_PORT:-5432}:5432'
    volumes:
      - postgres-local-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-qleanfeel_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-qleanfeel_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in backend/.env or backend/.env.test}
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-local-data:
  postgres-test-data:
