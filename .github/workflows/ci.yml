name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-backend:
    name: Validate production backend foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qleanfeel_test
          POSTGRES_USER: qleanfeel_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qleanfeel_test -d qleanfeel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend checks
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://qleanfeel_test:test-only-ci-password@127.0.0.1:5432/qleanfeel_test
          TEST_DATABASE_URL: postgresql://qleanfeel_test:test-only-ci-password@127.0.0.1:5432/qleanfeel_test
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run test:postgres
          npm run db:check
          npm run build

  verify-android:
    name: Validate and build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --ci

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qleanfeel-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: qleanfeel-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
